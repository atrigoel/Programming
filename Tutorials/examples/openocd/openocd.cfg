# Project-local OpenOCD config for a generic STM32F4 (Cortex-M4) over ST-Link/SWD.
# Run:  openocd -f openocd.cfg
#
# Adjust the two `source` lines for your probe/chip:
#   interface/  -> stlink.cfg, jlink.cfg, cmsis-dap.cfg, ...
#   target/     -> stm32f4x.cfg, stm32l4x.cfg, nrf52.cfg, ...

source [find interface/stlink.cfg]

# SWD is the default 2-wire transport for Cortex-M (frees pins, keeps SWO available).
transport select hla_swd

source [find target/stm32f4x.cfg]

# Lower this if the SWD link is unreliable (long wires, level shifting).
adapter speed 4000

# How the reset line is wired on the board. srst_only is common for Nucleo/Discovery.
reset_config srst_only

# --- Optional: ITM/SWO trace to a file --------------------------------------
# Uncomment and set TRACECLKIN to your real CPU/HCLK frequency (Hz).
# tpiu create swo -dap [dap names] -ap-num 0
# tpiu configure -protocol uart -traceclk 16000000 -pin-freq 2000000 -output swo.log
# itm ports on
